schema_version: 0
context:
  goal: Improve the mock project's authoritative score without changing evaluation conditions.
  success_criteria:
    - Increase score by more than 0.01 while preserving dataset and query count.
  allowed_paths:
    - config.json
  protected_paths:
    - experiment.py

environment:
  package_manager: system-python
  resource_class: light
  cwd: .
  commands:
    smoke: [python3, experiment.py, --smoke]
    full: [python3, experiment.py]
  timeout_seconds: 30
  required_env: []

evaluation:
  primary_metric:
    name: score
    direction: maximize
    parser:
      type: json
      path: results/metrics.json
      key: metrics.score
  required_artifacts:
    - results/metrics.json
  compatibility:
    - name: dataset_version
      expected: mock-v1
      parser:
        type: json
        path: results/metrics.json
        key: metadata.dataset_version
    - name: query_count
      expected: 100
      parser:
        type: json
        path: results/metrics.json
        key: metadata.query_count
    - name: evaluation_config
      expected: mock-eval-v1
      parser:
        type: json
        path: results/metrics.json
        key: metadata.evaluation_config
  min_duration_seconds: 0
  confirmation_runs: 2
  min_delta: 0.01
  noise_tolerance: 0.001

policy:
  campaign_id: mock-campaign
  branch_prefix: autoresearch
  max_experiments: 3
  experiment_timeout_seconds: 30
  campaign_timeout_seconds: 120
  allow_gpu: false
  allow_remote: false
  allow_paid: false
  allow_shell: false
  auto_commit: true

