[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-loop-plugin"
version = "0.4.0"
description = "Bootstrap safe autonomous research loops in existing Git projects."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
research-loop = "research_loop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/research_loop"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
